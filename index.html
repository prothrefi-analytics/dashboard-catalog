<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prothrefi Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #6b6878;
    --card: #2b2738;
    --field: #3a3548;
    --field-border: #4a4560;
    --text: #ffffff;
    --muted: #a9a4bd;
    --accent: #6e56b8;
    --accent-hover: #7c64c9;
    --link: #b9a8ff;
    --danger: #ff7b8a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    background: var(--page); color: var(--text);
    display: flex; align-items: center; justify-content: center;
  }
  button { font-family: inherit; cursor: pointer; }

  /* ---------- Logo ---------- */
  .logo-chip {
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; padding: 0;
  }
  .logo-chip svg {
    height: 38px; width: 60px; display: block; overflow: visible;
    filter: none;
  }
  .brand { display: flex; flex-direction: column; align-items: center; margin-bottom: 26px; text-align: center; }
    .brand .logo-chip svg { height: 78px; width: 122px; }
  .brand-name { font-family: "Montserrat", "Segoe UI", system-ui, sans-serif; margin-top: 14px; line-height: 1; }
  .brand-name .b1 { display: block; font-size: 25px; font-weight: 600; letter-spacing: 7px; text-transform: uppercase; padding-left: 7px; }
  .brand-name .b2 { display: block; font-size: 11.5px; font-weight: 300; letter-spacing: 9px; text-transform: uppercase; color: #d6ccff; margin-top: 8px; padding-left: 9px; }

  /* ---------- Shell (login + menu) ---------- */
  #shell {
    width: min(960px, 94vw); min-height: min(600px, 92vh);
    background: var(--card); border-radius: 16px; padding: 14px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
    box-shadow: 0 30px 70px rgba(20,15,40,.45);
  }
  #shell.hidden, #dashView.hidden { display: none; }

  .hero {
    position: relative; border-radius: 12px; overflow: hidden; min-height: 520px;
    display: flex; flex-direction: column; justify-content: flex-end; padding: 22px;
  }
  .hero > svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hero .caption, .hero .dots { position: relative; z-index: 1; }
  .caption { text-align: center; font-size: 26px; line-height: 1.25; font-weight: 400; padding: 0 12px; min-height: 66px; transition: opacity .4s; }
  .dots { display: flex; justify-content: center; gap: 10px; margin: 18px 0 6px; }
  .dots span { width: 34px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.3); transition: background .3s; }
  .dots span.on { background: #fff; }

  .panel { display: none; flex-direction: column; justify-content: center; padding: 28px 34px; }
  .panel.active { display: flex; }
  .panel h1 { font-size: 34px; font-weight: 500; letter-spacing: -.5px; margin-bottom: 10px; text-align: center; }
  .panel p.sub { font-size: 13px; color: var(--muted); margin-bottom: 28px; text-align: center; }

  .field { position: relative; margin-bottom: 14px; }
  .field input {
    width: 100%; height: 48px; padding: 0 44px 0 16px; font-size: 14px; color: var(--text);
    background: var(--field); border: 1px solid transparent; border-radius: 6px; outline: none;
    transition: border-color .15s, background .15s;
  }
  .field input::placeholder { color: #8a85a0; }
  .field input:focus { border-color: #8f7be0; background: #3f3a52; }
  .eye {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--muted); padding: 6px; display: flex;
  }
  .eye:hover { color: #fff; }
  .error { min-height: 20px; font-size: 12.5px; color: var(--danger); margin: 2px 0 10px; }
  .shake { animation: shake .35s; }
  @keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }

  .btn-main {
    width: 100%; height: 46px; border: none; border-radius: 4px; background: var(--accent);
    color: #fff; font-size: 14px; font-weight: 500; transition: background .15s;
  }
  .btn-main:hover { background: var(--accent-hover); }

  /* menu */
  .dash-btn {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    background: var(--field); border: 1px solid var(--field-border); border-radius: 8px;
    color: #fff; padding: 16px 18px; margin-bottom: 12px; font-size: 15px;
    transition: background .15s, border-color .15s, transform .1s;
  }
  .dash-btn:hover { background: #453f5a; border-color: #8f7be0; transform: translateY(-1px); }
  .dash-btn .ico {
    width: 40px; height: 40px; border-radius: 10px; background: var(--accent);
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  .dash-btn small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .dash-btn .arrow { margin-left: auto; color: var(--muted); }
  .link-btn { background: none; border: none; color: var(--link); font-size: 13px; text-decoration: underline; align-self: center; margin-top: 12px; }

  /* ---------- Dashboard view ---------- */
  #dashView { position: fixed; inset: 0; background: #1f1b2c; display: flex; flex-direction: column; }
  .topbar {
    display: flex; align-items: center; gap: 14px; padding: 10px 16px;
    background: var(--card); border-bottom: 1px solid var(--field-border);
  }
    .topbar .logo-chip svg { height: 30px; width: 47px; }
  .topbar .tb-brand { font-family: "Montserrat", "Segoe UI", sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; white-space: nowrap; }
  .topbar .tb-brand span { font-weight: 300; color: var(--link); }
  .topbar h2 { font-size: 16px; font-weight: 500; flex: 1; color: var(--muted); border-left: 1px solid var(--field-border); padding-left: 14px; }
  .btn-back, .btn-exit { height: 38px; padding: 0 18px; border-radius: 6px; font-size: 14px; font-weight: 500; }
  .btn-back { background: transparent; color: #fff; border: 1px solid #8a85a0; }
  .btn-back:hover { background: rgba(255,255,255,.08); }
  .btn-exit { background: #d9485f; color: #fff; border: 1px solid transparent; }
  .btn-exit:hover { background: #e55a70; }
  iframe { flex: 1; width: 100%; border: 0; background: #fff; }

  /* ---------- Opening page ---------- */
  #landing {
    position: fixed; inset: 0; overflow: hidden; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 30%, #3b2f7a 0%, #241f3f 48%, #15112a 100%);
  }
  #landing.hidden { display: none; }
  .orb { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .5; animation: drift 16s ease-in-out infinite alternate; }
  .orb.o1 { width: 420px; height: 420px; background: #6e56b8; top: -120px; left: -100px; }
  .orb.o2 { width: 360px; height: 360px; background: #2e6da4; bottom: -80px; right: -80px; animation-delay: -6s; opacity: .38; }
  .orb.o3 { width: 260px; height: 260px; background: #9a86ee; top: 38%; right: 18%; animation-delay: -11s; opacity: .25; }
  @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(50px,36px) scale(1.15); } }
  .grid-bg {
    position: absolute; inset: 0; opacity: .5;
    background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
    background-size: 56px 56px;
    -webkit-mask-image: radial-gradient(ellipse at center, #000 20%, transparent 72%); mask-image: radial-gradient(ellipse at center, #000 20%, transparent 72%);
  }
  .bars { position: absolute; left: 0; right: 0; bottom: 0; height: 24%; display: flex; align-items: flex-end; justify-content: center; gap: 1.2vw; padding: 0 2vw; pointer-events: none; }
  .bars i {
    flex: 1; max-width: 44px; border-radius: 6px 6px 0 0; transform-origin: bottom; transform: scaleY(0);
    background: linear-gradient(to top, rgba(110,86,184,0) 0%, rgba(110,86,184,.55) 60%, rgba(185,168,255,.7) 100%);
    animation: rise 1.2s cubic-bezier(.2,.8,.2,1) forwards, breathe 5s ease-in-out infinite;
  }
  @keyframes rise { to { transform: scaleY(1); } }
  @keyframes breathe { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  .land-card { position: relative; z-index: 2; text-align: center; padding: 24px; max-width: 640px; margin-top: -6vh; animation: fadeUp .9s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  .land-card .logo-chip svg { height: 104px; width: 162px; }
  .land-card .brand-name { margin-top: 18px; }
  .land-card .brand-name .b1 { font-size: 34px; letter-spacing: 11px; padding-left: 11px; }
  .land-card .brand-name .b2 { font-size: 14px; letter-spacing: 13px; padding-left: 13px; margin-top: 12px; color: #d6ccff; }
  .rule { width: 64px; height: 2px; margin: 30px auto 22px; border-radius: 2px; background: linear-gradient(90deg, transparent, #9a86ee, transparent); }
  .land-card h1 { font-family: "Montserrat", "Segoe UI", system-ui, sans-serif; font-size: 22px; font-weight: 300; letter-spacing: 6px; text-transform: uppercase; }
  #tagline { font-size: 15px; color: var(--muted); margin-top: 12px; min-height: 22px; transition: opacity .4s; }
  .cta {
    display: inline-flex; align-items: center; gap: 12px; margin-top: 38px; height: 54px; padding: 0 34px;
    border: none; border-radius: 999px; color: #fff; font-size: 15px; font-weight: 500; letter-spacing: .5px;
    background: linear-gradient(135deg, #7a60d0, #5a43a8);
    box-shadow: 0 10px 30px rgba(110,86,184,.5), inset 0 1px 0 rgba(255,255,255,.25);
    transition: transform .15s, box-shadow .15s;
  }
  .cta:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(110,86,184,.65), inset 0 1px 0 rgba(255,255,255,.3); }
  .cta .arr { transition: transform .15s; }
  .cta:hover .arr { transform: translateX(4px); }
  .land-count { margin-top: 22px; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #8d86a8; }
  @media (prefers-reduced-motion: reduce) { .orb, .bars i, .land-card { animation: none; } .bars i { transform: none; } }
  @media (max-width: 600px) {
    .land-card .logo-chip svg { height: 84px; width: 130px; }
    .land-card .brand-name .b1 { font-size: 26px; letter-spacing: 8px; padding-left: 8px; }
    .land-card .brand-name .b2 { font-size: 12px; letter-spacing: 10px; padding-left: 10px; }
    .land-card h1 { font-size: 17px; letter-spacing: 4px; }
  }

  #catalogView.hidden { display: none; }
  #catalogView {
    position: fixed; inset: 0; display: flex; flex-direction: column; overflow: hidden;
    background: radial-gradient(ellipse at 50% 35%, #3a2f6b 0%, #241f3a 45%, #1a1628 100%);
  }
  .topbar .spacer { flex: 1; }
  .topbar .who { font-size: 13px; color: var(--muted); }
  .topbar .who b { color: #fff; font-weight: 500; }
  .cat-body { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; padding: 22px 0 14px; overflow-y: auto; }
  .cat-body h1 { font-size: 30px; font-weight: 500; letter-spacing: -.3px; text-align: center; }
  .cat-sub { font-size: 13px; color: var(--muted); margin: 8px 16px 0; text-align: center; }

  .carousel { position: relative; width: 100%; --cw: max(240px, min(60vw, 560px, calc((100vh - 400px) * 1.78))); }
  .track {
    position: relative; display: flex; align-items: center; overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch;
    padding: 34px 0 30px; cursor: grab; overscroll-behavior-x: contain;
  }
  .track::-webkit-scrollbar { display: none; }
  .track::before, .track::after { content: ""; flex: 0 0 calc(50% - var(--cw) / 2 + 20px); }
  .track.dragging { scroll-snap-type: none; cursor: grabbing; user-select: none; }
  .item {
    flex: 0 0 var(--cw); margin: 0 -20px; scroll-snap-align: center;
    transform-origin: center; will-change: transform, opacity; user-select: none;
  }
  .thumb {
    position: relative; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden;
    border: 1px solid #4a4560; background: #241f35;
    box-shadow: 0 18px 40px rgba(10,6,24,.5);
    transition: border-color .2s, box-shadow .2s;
  }
  .item.is-active .thumb { border-color: #9a86ee; box-shadow: 0 22px 50px rgba(10,6,24,.6), 0 0 0 3px rgba(154,134,238,.25); }
  .thumb svg, .thumb img { width: 100%; height: 100%; display: block; object-fit: cover; pointer-events: none; }
  .thumb .label {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 16px 10px;
    background: linear-gradient(to top, rgba(20,15,40,.8), rgba(20,15,40,0));
    font-size: 15px; font-weight: 500; pointer-events: none;
  }
  .nav {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 3;
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid #5b5575;
    background: rgba(43,39,56,.85); color: #fff; font-size: 26px; line-height: 1; padding-bottom: 3px;
    transition: background .15s, opacity .15s;
  }
  .nav:hover { background: #453f5a; }
  .nav:disabled { opacity: .25; cursor: default; }
  .nav.prev { left: 18px; } .nav.next { right: 18px; }

  .active-info { text-align: center; padding: 0 20px; max-width: 520px; }
  .active-info h3 { font-size: 20px; font-weight: 500; }
  .active-info p { font-size: 13px; color: var(--muted); margin: 6px 0 16px; min-height: 18px; }
  .btn-main.open { width: auto; min-width: 200px; padding: 0 28px; }
  .cdots { display: flex; gap: 8px; margin-top: 16px; }
  .cdots button { width: 8px; height: 8px; border-radius: 50%; border: none; background: rgba(255,255,255,.3); padding: 0; transition: all .2s; }
  .cdots button.on { background: #fff; width: 24px; border-radius: 4px; }

  @media (max-width: 760px) {
    body { align-items: flex-start; }
    #shell { grid-template-columns: 1fr; margin: 12px 0; }
    .hero { min-height: 230px; }
    .caption { font-size: 20px; min-height: 0; }
    .panel { padding: 24px 12px; }
    .panel h1 { font-size: 30px; }
    .carousel { --cw: max(240px, min(76vw, calc((100vh - 400px) * 1.78))); }
    .nav { display: none; }
    .topbar .who { display: none; }
    .topbar .tb-brand { display: none; }
    .cat-body h1 { font-size: 24px; }
  }
</style>
</head>
<body>

<!-- Shared logo definition -->
<svg style="position:absolute;width:0;height:0" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="barV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a6fd6"/><stop offset="1" stop-color="#14285a"/></linearGradient>
    <linearGradient id="barH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f1f45" stop-opacity="0.75"/><stop offset="0.45" stop-color="#0f1f45" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#0f1f45" stop-opacity="0"/><stop offset="1" stop-color="#0f1f45" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="letters" gradientUnits="userSpaceOnUse" x1="90" y1="0" x2="500" y2="0">
      <stop offset="0" stop-color="#1a2f5a"/><stop offset="0.38" stop-color="#5b6b86"/><stop offset="0.62" stop-color="#b9c0cc"/><stop offset="1" stop-color="#f4f6f9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.5"/><feOffset dx="2" dy="3" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="bars">
      <rect x="85" y="218" width="45" height="107"/><rect x="130" y="218" width="48" height="107"/>
      <rect x="178" y="175" width="46" height="150"/><rect x="224" y="130" width="44" height="195"/>
      <rect x="268" y="95" width="45" height="230"/><rect x="313" y="130" width="45" height="195"/>
      <rect x="358" y="175" width="47" height="150"/><rect x="405" y="218" width="47" height="107"/>
      <rect x="452" y="240" width="48" height="85"/>
    </clipPath>
    <symbol id="pa-logo" viewBox="60 60 470 300">
      <g filter="url(#shadow)">
        <g clip-path="url(#bars)">
          <rect x="85" y="95" width="415" height="230" fill="url(#barV)"/>
          <rect x="85" y="95" width="415" height="230" fill="url(#barH)"/>
        </g>
        <g stroke="#7d8594" stroke-width="1.6">
          <line x1="130" y1="218" x2="130" y2="325"/><line x1="178" y1="175" x2="178" y2="325"/>
          <line x1="224" y1="130" x2="224" y2="325"/><line x1="268" y1="95" x2="268" y2="325"/>
          <line x1="313" y1="130" x2="313" y2="325"/><line x1="358" y1="175" x2="358" y2="325"/>
          <line x1="405" y1="218" x2="405" y2="325"/><line x1="452" y1="240" x2="452" y2="325"/>
        </g>
      </g>
      <g filter="url(#shadow)" fill="url(#letters)" fill-rule="evenodd">
        <path d="M 90 200 A 112 112 0 1 1 314 200 A 112 112 0 1 1 90 200 Z M 122 200 A 80 80 0 1 0 282 200 A 80 80 0 1 0 122 200 Z"/>
        <rect x="90" y="200" width="32" height="125"/>
        <path d="M 290 215 A 105 105 0 1 1 500 215 A 105 105 0 1 1 290 215 Z M 322 215 A 73 73 0 1 0 468 215 A 73 73 0 1 0 322 215 Z"/>
        <rect x="468" y="215" width="32" height="110"/>
      </g>
    </symbol>
  </defs>
</svg>

<!-- ===== OPENING PAGE ===== -->
<div id="landing">
  <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
  <div class="grid-bg"></div>
  <div class="bars" id="landBars" aria-hidden="true"></div>
  <main class="land-card">
    <div class="logo-chip"><svg role="img" aria-label="Prothrefi Analytics logo"><use href="#pa-logo" width="100%" height="100%"/></svg></div>
    <div class="brand-name"><span class="b1">Prothrefi</span><span class="b2">Analytics</span></div>
    <div class="rule"></div>
    <p id="tagline">Insights that move your business forward</p>
    <button class="cta" id="btnEnter">Explore dashboards <span class="arr">&rarr;</span></button>
  </main>
</div>

<!-- ===== CATALOG PAGE ===== -->
<div id="catalogView" class="hidden">
  <div class="topbar">
    <div class="logo-chip"><svg role="img" aria-label="Prothrefi Analytics logo"><use href="#pa-logo" width="100%" height="100%"/></svg></div>
    <div class="tb-brand">Prothrefi <span>Analytics</span></div>
    <div class="spacer"></div>
    <button class="btn-back" id="btnHome">&larr; Home</button>
  </div>
  <div class="cat-body">
    <h1>Dashboard Catalog</h1>
    <p class="cat-sub">Swipe left or right to browse &middot; tap the highlighted dashboard to open it</p>
    <div class="carousel">
      <button class="nav prev" id="btnPrev" aria-label="Previous dashboard">&#8249;</button>
      <div class="track" id="track"></div>
      <button class="nav next" id="btnNext" aria-label="Next dashboard">&#8250;</button>
    </div>
    <div class="active-info">
      <h3 id="activeTitle">Dashboard</h3>
      <p id="activeDesc"></p>
      <button class="btn-main open" id="btnOpen">Open dashboard</button>
    </div>
    <div class="cdots" id="catDots"></div>
  </div>
</div>

<!-- ===== DASHBOARD ===== -->
<div id="dashView" class="hidden">
  <div class="topbar">
    <div class="logo-chip"><svg role="img" aria-label="Logo"><use href="#pa-logo" width="100%" height="100%"/></svg></div>
    <div class="tb-brand">Prothrefi <span>Analytics</span></div>
    <h2 id="dashTitle">Dashboard</h2>
    <button class="btn-back" id="btnBack">&larr; Back</button>
    <button class="btn-exit" id="btnExit">Exit</button>
  </div>
  <iframe id="dashFrame" title="Embedded dashboard" allowfullscreen></iframe>
</div>

<!-- Dashboard snapshot images (embedded so this page is a single file).
     To use a hosted image instead, set "thumb" in the DASHBOARDS list below to its URL. -->

  (function () {
    var bars = $("landBars"), n = 28;
    for (var i = 0; i < n; i++) {
      var x = i / (n - 1), el = document.createElement("i");
      var h = 22 + 70 * Math.pow(Math.sin(x * Math.PI), 1.4) * (0.55 + 0.45 * Math.abs(Math.sin(i * 2.3 + 1)));
      el.style.height = h.toFixed(0) + "%";
      el.style.animationDelay = (i * 0.045).toFixed(2) + "s, " + (1.2 + i * 0.18).toFixed(2) + "s";
      bars.appendChild(el);
    }
  })();
  $("btnEnter").addEventListener("click", function () { showView("catalog"); });

  /* ---------- generated preview art (replace via "thumb") ---------- */
  function art(k) {
    var bg = '<rect width="320" height="200" fill="#241f35"/><rect x="14" y="12" width="84" height="8" rx="4" fill="#4a4560"/><circle cx="298" cy="16" r="6" fill="#6e56b8"/>';
    var out = "", i;
    var k4 = k % 4;
    if (k4 === 0) {
      for (i = 0; i < 3; i++) out += '<rect x="' + (14 + i * 102) + '" y="34" width="92" height="38" rx="8" fill="#332d47"/><rect x="' + (24 + i * 102) + '" y="44" width="40" height="6" rx="3" fill="#6b6585"/><rect x="' + (24 + i * 102) + '" y="56" width="58" height="9" rx="4" fill="' + (i === 1 ? "#b9a8ff" : "#8f7be0") + '"/>';
      var h = [40, 62, 48, 80, 66, 92, 74, 100, 86, 112];
      for (i = 0; i < 10; i++) out += '<rect x="' + (20 + i * 30) + '" y="' + (190 - h[i]) + '" width="19" height="' + h[i] + '" rx="4" fill="' + (i === 9 ? "#b9a8ff" : "#6e56b8") + '"/>';
    } else if (k4 === 1) {
      for (i = 0; i < 4; i++) out += '<line x1="14" x2="306" y1="' + (50 + i * 34) + '" y2="' + (50 + i * 34) + '" stroke="#3a3450" stroke-width="1"/>';
      var pts = "14,150 54,126 94,138 134,98 174,112 214,72 254,86 306,48";
      out += '<polygon points="' + pts + ' 306,184 14,184" fill="#6e56b8" opacity=".28"/><polyline points="' + pts + '" fill="none" stroke="#b9a8ff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>';
      var pts2 = "14,170 54,160 94,164 134,140 174,148 214,126 254,132 306,110";
      out += '<polyline points="' + pts2 + '" fill="none" stroke="#4a8cf0" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/>';
    } else if (k4 === 2) {
      out += '<circle cx="90" cy="112" r="44" fill="none" stroke="#332d47" stroke-width="18"/>' +
             '<circle cx="90" cy="112" r="44" fill="none" stroke="#6e56b8" stroke-width="18" stroke-dasharray="130 276.5" transform="rotate(-90 90 112)"/>' +
             '<circle cx="90" cy="112" r="44" fill="none" stroke="#b9a8ff" stroke-width="18" stroke-dasharray="80 276.5" stroke-dashoffset="-130" transform="rotate(-90 90 112)"/>' +
             '<circle cx="90" cy="112" r="44" fill="none" stroke="#4a8cf0" stroke-width="18" stroke-dasharray="50 276.5" stroke-dashoffset="-210" transform="rotate(-90 90 112)"/>';
      var w = [130, 104, 84, 62, 40];
      for (i = 0; i < 5; i++) out += '<rect x="160" y="' + (52 + i * 28) + '" width="146" height="14" rx="7" fill="#332d47"/><rect x="160" y="' + (52 + i * 28) + '" width="' + w[i] + '" height="14" rx="7" fill="' + (i % 2 ? "#8f7be0" : "#6e56b8") + '"/>';
    } else {
      for (i = 0; i < 6; i++) {
        var x = 14 + (i % 3) * 102, y = 36 + Math.floor(i / 3) * 80;
        out += '<rect x="' + x + '" y="' + y + '" width="92" height="70" rx="9" fill="#332d47"/><rect x="' + (x + 9) + '" y="' + (y + 9) + '" width="34" height="6" rx="3" fill="#6b6585"/>';
        var d = "M" + (x + 9) + "," + (y + 56);
        for (var j = 1; j < 6; j++) d += " L" + (x + 9 + j * 14.8) + "," + (y + 56 - ((i * 7 + j * 11) % 26) - 4);
        out += '<path d="' + d + '" fill="none" stroke="' + (i % 2 ? "#b9a8ff" : "#8f7be0") + '" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
      }
    }
    return '<svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' + bg + out + '</svg>';
  }

  /* ---------- catalog carousel ---------- */
  var track = $("track");
  var items = [];
  var ticking = false;

  function buildCatalog() {
    track.innerHTML = "";
    $("catDots").innerHTML = "";
    items = [];
    DASHBOARDS.forEach(function (d, i) {
      var it = document.createElement("div");
      it.className = "item";
      it.setAttribute("role", "button");
      it.setAttribute("aria-label", d.title);
      var inner = d.thumb ? '<img src="' + d.thumb + '" alt="" draggable="false">' : art(i);
      it.innerHTML = '<div class="thumb">' + inner + '<div class="label"></div></div>';
      it.querySelector(".label").textContent = d.title;
      it.addEventListener("click", function () {
        if (dragMoved) return;
        if (i === activeIdx) openDash(i); else goTo(i);
      });
      track.appendChild(it);
      items.push(it);

      var b = document.createElement("button");
      b.setAttribute("aria-label", "Go to " + d.title);
      b.addEventListener("click", function () { goTo(i); });
      $("catDots").appendChild(b);
    });
  }

  function scrollToIndex(i, behavior) {
    var it = items[i];
    if (!it) return;
    track.scrollTo({ left: it.offsetLeft + it.offsetWidth / 2 - track.clientWidth / 2, behavior: behavior || "smooth" });
  }
  function goTo(i) {
    i = Math.max(0, Math.min(items.length - 1, i));
    scrollToIndex(i, "smooth");
  }

  function setActive(i) {
    activeIdx = i;
    var dots = $("catDots").children;
    for (var k = 0; k < items.length; k++) {
      items[k].classList.toggle("is-active", k === i);
      dots[k].className = k === i ? "on" : "";
    }
    $("activeTitle").textContent = DASHBOARDS[i].title;
    $("activeDesc").textContent = DASHBOARDS[i].desc || "";
    $("btnPrev").disabled = i === 0;
    $("btnNext").disabled = i === items.length - 1;
  }

  // zoom the dashboard nearest the centre; shrink and dim the rest
  function updateCarousel() {
    ticking = false;
    if (!items.length) return;
    var c = track.scrollLeft + track.clientWidth / 2, best = 0, bestD = 1e9;
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var d = Math.abs(c - (it.offsetLeft + it.offsetWidth / 2));
      if (d < bestD) { bestD = d; best = i; }
      var t = Math.min(d / (it.offsetWidth * 0.95), 1);
      it.style.transform = "scale(" + (1 - 0.3 * t).toFixed(3) + ")";
      it.style.opacity = (1 - 0.6 * t).toFixed(3);
    }
    if (best !== activeIdx || !items[best].classList.contains("is-active")) setActive(best);
  }
  track.addEventListener("scroll", function () {
    if (!ticking) { ticking = true; requestAnimationFrame(updateCarousel); }
  }, { passive: true });
  window.addEventListener("resize", function () {
    if (!$("catalogView").classList.contains("hidden")) { scrollToIndex(activeIdx, "auto"); updateCarousel(); }
  });

  // mouse drag-to-swipe (touch screens already swipe natively)
  var dragging = false, dragMoved = false, dragStartX = 0, dragStartScroll = 0;
  track.addEventListener("pointerdown", function (e) {
    if (e.pointerType !== "mouse") return;
    dragging = true; dragMoved = false;
    dragStartX = e.clientX; dragStartScroll = track.scrollLeft;
  });
  window.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    var dx = e.clientX - dragStartX;
    if (Math.abs(dx) > 5) { dragMoved = true; track.classList.add("dragging"); }
    if (dragMoved) track.scrollLeft = dragStartScroll - dx;
  });
  window.addEventListener("pointerup", function () {
    if (!dragging) return;
    dragging = false;
    if (dragMoved) {
      track.classList.remove("dragging");
      goTo(activeIdx);
      setTimeout(function () { dragMoved = false; }, 0);
    }
  });

  $("btnPrev").addEventListener("click", function () { goTo(activeIdx - 1); });
  $("btnNext").addEventListener("click", function () { goTo(activeIdx + 1); });
  $("btnOpen").addEventListener("click", function () { openDash(activeIdx); });
  document.addEventListener("keydown", function (e) {
    if (!$("landing").classList.contains("hidden")) { if (e.key === "Enter") showView("catalog"); return; }
    if ($("catalogView").classList.contains("hidden")) return;
    if (e.key === "ArrowLeft") goTo(activeIdx - 1);
    else if (e.key === "ArrowRight") goTo(activeIdx + 1);
    else if (e.key === "Enter") openDash(activeIdx);
  });

  $("btnHome").addEventListener("click", goHome);
  $("btnBack").addEventListener("click", goCatalog);
  $("btnExit").addEventListener("click", goHome);

  buildCatalog();

  /* ---------- rotating tagline on the opening page ---------- */
  var idx = 0;
  setInterval(function () {
    idx = (idx + 1) % CAPTIONS.length;
    var cap = $("tagline");
    cap.style.opacity = 0;
    setTimeout(function () { cap.textContent = CAPTIONS[idx]; cap.style.opacity = 1; }, 400);
  }, 4500);
</script>
</body>
</html>
